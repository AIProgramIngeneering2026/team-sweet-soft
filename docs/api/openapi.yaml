openapi: 3.1.0

info:
  title: Sweet Soft, сервис прогона матчей
  version: 0.1.0
  description: |
    Job это прогон, ресурс `/runs`. Работу выполняет Tool из `GET /tools`.

    Все ошибки в формате `Error`. `details` только у `invalid_params`.

    | HTTP | `code` | Когда |
    | --- | --- | --- |
    | 404 | `run_not_found` | Job с таким id нет |
    | 409 | `invalid_transition` | Переход запрещен жизненным циклом Job |
    | 409 | `idempotency_key_conflict` | `Idempotency-Key` уже использован с другим телом |
    | 413 | `payload_too_large` | Тело больше 100 МБ |
    | 422 | `invalid_params` | Тело, query или заголовок не прошли проверку |
    | 422 | `unknown_tool` | Tool нет в Registry |
    | 500 | `internal_error` | Внутренняя ошибка |
    | 503 | `service_unavailable` | БД недоступна |

servers:
  - url: http://localhost:8000

tags:
  - name: runs
  - name: tools
  - name: service

paths:
  /runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Создать прогон
      description: |
        Порядок проверок:
        1. Формат заголовков и тела: 413 или 422 `invalid_params`.
        2. Ключ уже есть: то же тело 200, другое тело 409 `idempotency_key_conflict`.
        3. Registry: 422 `unknown_tool`.
        4. `validate(params)`: 422 `invalid_params`.
        5. Job создан и поставлен в очередь: 201.

        При отказе на шагах 1, 3, 4 Job не создается, ключ остается свободным.
        См. `docs/adr/0002-idempotency-key.md`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
            examples:
              series_summary:
                value:
                  tool: series_summary
                  params:
                    bot_name: X
                    replays:
                      - name: game01.SC2Replay
                        content_base64: TVBRGwAAAAAAAAAAAAAAAAAA
              ab_compare:
                value:
                  tool: ab_compare
                  params:
                    baseline_run_id: 5b1c8f0e-2d4a-4c1e-9f3a-7e2b6d0a1c11
                    candidate_run_id: 9a7d3e2f-1b6c-4f8e-a0d5-3c4b2e1f0a22
              arena_sync:
                value:
                  tool: arena_sync
                  params:
                    bot_id: 1234
      responses:
        '201':
          description: Job создан
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                queued:
                  $ref: '#/components/examples/RunQueued'
        '200':
          description: Повтор с тем же ключом и телом. Тот же Job в текущем состоянии, новый не создан
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              schema:
                type: string
                const: 'true'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                running:
                  $ref: '#/components/examples/RunRunning'
        '409':
          description: Ключ уже использован с другим телом
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: idempotency_key_conflict
                  message: "Ключ уже привязан к Job '5b1c8f0e-2d4a-4c1e-9f3a-7e2b6d0a1c11' с другим телом"
                  correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: Job не создан
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_params:
                  value:
                    error:
                      code: invalid_params
                      message: Параметры series_summary не прошли проверку
                      correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
                      details:
                        - field: params.bot_name
                          message: Обязательное поле
                        - field: params.replays[3]
                          message: Реплей больше 5 МБ
                missing_tool:
                  value:
                    error:
                      code: invalid_params
                      message: Тело запроса не прошло проверку
                      correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
                      details:
                        - field: tool
                          message: Обязательное поле
                bad_idempotency_key:
                  value:
                    error:
                      code: invalid_params
                      message: Заголовок не прошел проверку
                      correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
                      details:
                        - field: header.Idempotency-Key
                          message: Нужно от 1 до 255 печатных ASCII символов
                unknown_tool:
                  value:
                    error:
                      code: unknown_tool
                      message: "Tool 'replay_stat' не найден"
                      correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [runs]
      operationId: listRuns
      summary: Список прогонов, новые первыми
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: tool
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Страница списка
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '422':
          description: Query не прошел проверку
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_params
                  message: Параметры запроса не прошли проверку
                  correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
                  details:
                    - field: query.limit
                      message: Нужно от 1 до 100
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /runs/{run_id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Статус, результат и история прогона
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Job
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                done:
                  $ref: '#/components/examples/RunDone'
                partial:
                  $ref: '#/components/examples/RunPartial'
                failed:
                  $ref: '#/components/examples/RunFailed'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /runs/{run_id}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Отменить прогон
      description: |
        Разрешено из `created`, `queued`, `running`. Из конечных состояний, в том числе
        повторная отмена: 409 `invalid_transition`. `Idempotency-Key` не принимает.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Job отменен
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                cancelled:
                  $ref: '#/components/examples/RunCancelled'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          description: Job в конечном состоянии
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_transition
                  message: Нельзя отменить Job в состоянии done
                  correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tools:
    get:
      tags: [tools]
      operationId: listTools
      summary: Tool из Registry
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Список Tool
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolList'
              example:
                items:
                  - name: series_summary
                    description: Процент побед по серии реплеев
                  - name: ab_compare
                    description: Сравнение двух серий
                  - name: arena_sync
                    description: Результаты матчей с AI Arena
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [service]
      operationId: getHealth
      summary: Состояние сервиса и БД
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Сервис и БД работают
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                checks:
                  db: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      description: Неизвестный или не-UUID id дает 404 `run_not_found`
      schema:
        type: string

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Нет ключа: каждый запрос создает Job. Новый ключ: 201. Тот же ключ и тело: 200,
        тот же Job. Тот же ключ, другое тело: 409. Тело сравнивается по SHA-256 от
        `tool` и `params` в каноническом JSON. См. `docs/adr/0002-idempotency-key.md`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]+$'
        example: 3f1d2c4b-8a7e-4f60-9b1d-2e5c7a9f0b13

    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Если нет или не по формату, сервис создает свой
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'

  headers:
    CorrelationId:
      schema:
        type: string
    Location:
      schema:
        type: string
        example: /runs/5b1c8f0e-2d4a-4c1e-9f3a-7e2b6d0a1c11

  responses:
    RunNotFound:
      description: Job с таким id нет
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: run_not_found
              message: "Job '5b1c8f0e-2d4a-4c1e-9f3a-7e2b6d0a1c11' не найден"
              correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
    PayloadTooLarge:
      description: Тело больше 100 МБ
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: payload_too_large
              message: Тело запроса больше 100 МБ
              correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
    InternalError:
      description: Внутренняя ошибка, подробности в логе
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Внутренняя ошибка сервиса
              correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00
    ServiceUnavailable:
      description: БД недоступна, Job не создан и не изменен
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: service_unavailable
              message: БД недоступна
              correlation_id: 0f6c2a9e-4b7d-4e1a-8c3f-2d5b9e7a1f00

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            correlation_id:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'

    ErrorCode:
      type: string
      enum:
        - invalid_params
        - unknown_tool
        - payload_too_large
        - idempotency_key_conflict
        - invalid_transition
        - run_not_found
        - internal_error
        - service_unavailable

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Путь от корня запроса
          examples: [tool, params.bot_name, 'params.replays[3]', query.limit, header.Idempotency-Key]
        message:
          type: string

    CreateRunRequest:
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          type: string
          minLength: 1
        params:
          type: object
          description: |
            Проверяет `validate` у Tool. `series_summary`: `SeriesSummaryParams`,
            `ab_compare`: `AbCompareParams`, `arena_sync`: `ArenaSyncParams`.

    SeriesSummaryParams:
      type: object
      required: [bot_name, replays]
      properties:
        bot_name:
          type: string
          minLength: 1
        replays:
          type: array
          minItems: 1
          maxItems: 200
          description: |
            Тело запроса целиком не больше 100 МБ, это около 75 МБ реплеев до base64.
            Больше дает 413 `payload_too_large` до проверки полей.
          items:
            $ref: '#/components/schemas/ReplayUpload'

    ReplayUpload:
      type: object
      required: [name, content_base64]
      properties:
        name:
          type: string
        content_base64:
          type: string
          contentEncoding: base64
          description: Не больше 5 МБ после декодирования

    AbCompareParams:
      type: object
      required: [baseline_run_id, candidate_run_id]
      properties:
        baseline_run_id:
          type: string
        candidate_run_id:
          type: string
          description: Не равен `baseline_run_id`

    ArenaSyncParams:
      type: object
      required: [bot_id]
      properties:
        bot_id:
          type: integer
          minimum: 1

    RunStatus:
      type: string
      enum: [created, queued, running, done, partial, failed, cancelled]

    JobErrorCode:
      type: string
      enum:
        - external_unavailable
        - external_bad_response
        - invalid_source_run
        - no_valid_replays
        - internal_error

    Run:
      type: object
      required: [id, tool, params, status, created_at, updated_at, result, error_code, error_message, history]
      properties:
        id:
          type: string
          format: uuid
        tool:
          type: string
        params:
          type: object
          description: Реплеи без содержимого, в виде `ReplayRef`
        status:
          $ref: '#/components/schemas/RunStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          description: Только в `done` и `partial`
          oneOf:
            - $ref: '#/components/schemas/RunResult'
            - type: 'null'
        error_code:
          description: Только в `failed`
          oneOf:
            - $ref: '#/components/schemas/JobErrorCode'
            - type: 'null'
        error_message:
          type: [string, 'null']
        history:
          type: array
          items:
            $ref: '#/components/schemas/Transition'

    ReplayRef:
      type: object
      required: [name, sha256, size_bytes]
      properties:
        name:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size_bytes:
          type: integer

    RunResult:
      type: object
      required: [data, skipped, warnings]
      properties:
        data:
          type: object
          description: |
            `series_summary`: `SeriesSummaryResult`, `ab_compare`: `AbCompareResult`,
            `arena_sync`: `ArenaSyncResult`.
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedItem'
        warnings:
          type: array
          items:
            type: string
            examples: [low_sample, source_partial]

    SkippedItem:
      type: object
      required: [item, reason]
      properties:
        item:
          type: string
          example: 'params.replays[3]'
        reason:
          type: string
          enum: [corrupted_replay, not_sc2_replay, bot_not_in_replay]

    WinStats:
      type: object
      required: [total, wins, losses, draws, win_rate]
      properties:
        total:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        win_rate:
          type: number
          minimum: 0
          maximum: 100

    SeriesSummaryResult:
      allOf:
        - $ref: '#/components/schemas/WinStats'
        - type: object
          required: [by_map, by_opponent]
          properties:
            by_map:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/WinStats'
            by_opponent:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/WinStats'

    CompareRow:
      type: object
      required: [baseline, candidate, delta, only_in_one]
      properties:
        baseline:
          oneOf:
            - $ref: '#/components/schemas/WinStats'
            - type: 'null'
        candidate:
          oneOf:
            - $ref: '#/components/schemas/WinStats'
            - type: 'null'
        delta:
          type: [number, 'null']
          description: В п. п., `null` при `only_in_one`
        only_in_one:
          type: boolean

    AbCompareResult:
      type: object
      required: [overall, by_map, by_opponent]
      properties:
        overall:
          $ref: '#/components/schemas/CompareRow'
        by_map:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CompareRow'
        by_opponent:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CompareRow'

    ArenaSyncResult:
      type: object
      required: [fetched, new_matches]
      properties:
        fetched:
          type: integer
          minimum: 0
        new_matches:
          type: integer
          minimum: 0

    Transition:
      type: object
      required: [from, to, at, reason, correlation_id]
      properties:
        from:
          description: '`null` у первой записи'
          oneOf:
            - $ref: '#/components/schemas/RunStatus'
            - type: 'null'
        to:
          $ref: '#/components/schemas/RunStatus'
        at:
          type: string
          format: date-time
        reason:
          type: [string, 'null']
        correlation_id:
          type: string

    RunSummary:
      type: object
      required: [id, tool, status, created_at, updated_at, error_code]
      properties:
        id:
          type: string
          format: uuid
        tool:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        error_code:
          oneOf:
            - $ref: '#/components/schemas/JobErrorCode'
            - type: 'null'

    RunList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ToolInfo:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string

    ToolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'

    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ok
        checks:
          type: object
          required: [db]
          properties:
            db:
              type: string
              const: ok

  examples:
    RunQueued:
      value:
        id: 5b1c8f0e-2d4a-4c1e-9f3a-7e2b6d0a1c11
        tool: arena_sync
        params: {bot_id: 1234}
        status: queued
        created_at: '2026-11-14T10:00:00Z'
        updated_at: '2026-11-14T10:00:00Z'
        result: null
        error_code: null
        error_message: null
        history:
          - {from: null, to: created, at: '2026-11-14T10:00:00Z', reason: null, correlation_id: 0f6c2a9e}
          - {from: created, to: queued, at: '2026-11-14T10:00:00Z', reason: null, correlation_id: 0f6c2a9e}

    RunRunning:
      value:
